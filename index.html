<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QENS — Light R&D</title>
  <style>
    :root {
      --bg-color: #F7F7F7;
      --text-main: #111111;
      --text-muted: #444444;
      --emerald: #097969;
      --light-green: #5A7D6F;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px 30px;
      -webkit-font-smoothing: antialiased;
      text-align: center;
      gap: 32px; /* Rapproche directement le bas du logo QENS */
    }

    /* Marque centrale */
    .brand-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .brand-name {
      font-size: clamp(4.5rem, 16vw, 11rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--emerald);
      text-transform: uppercase;
      line-height: 1;
    }

    /* Footer & Concept */
    .concept-footer {
      max-width: 650px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .concept-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .concept-title {
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--light-green);
      line-height: 1.3;
    }

    .concept-desc {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: var(--text-muted);
      line-height: 1.4;
      font-weight: 500;
    }

    .meta-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .email-link {
      color: var(--text-main);
      text-decoration: none;
    }

    .email-link:hover {
      text-decoration: underline;
    }

    .status-text {
      color: var(--text-main);
    }

    .copyright {
      font-size: 0.75rem;
      color: var(--text-main);
      font-weight: 500;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Nom du studio au centre -->
  <main class="brand-container">
    <h1 class="brand-name">QENS</h1>
  </main>

  <!-- Section bas de page -->
  <footer class="concept-footer">
    <div class="concept-header">
      <h2 class="concept-title">CONCEPTS D’ACTIFS PRÊTS À L’EMPLOI. LIGHT R&D.</h2>
      <p class="concept-desc">Gagnez du temps, orientez votre vision, structurez vos objectifs.</p>
    </div>

    <div class="meta-info">
      <p><a href="mailto:contact@qens.fr" class="email-link">contact@qens.fr</a></p>
      <p class="status-text">Opening Soon / Disponible Prochainement (Q4 2026)</p>
    </div>

    <p class="copyright">
      © 2026 QENS STUDIO PARIS FR.<br>
      All Rights Reserved.
    </p>
  </footer>

</body>
</html>
